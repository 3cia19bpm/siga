<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172b1e">
  <title>SIGA 3ª CIA</title>
  <style>
    :root{color-scheme:light;--g:#173923;--m:#738078;--b:#d7e0d4;--bg:#f3f6f1}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--g)}
    body{min-height:100vh;display:grid;place-items:center;padding:24px}
    .c{width:min(100%,420px);padding:28px 24px;border:1px solid var(--b);border-radius:24px;background:#fff;box-shadow:0 18px 50px rgba(22,57,33,.10);text-align:center}
    .s{width:46px;height:46px;margin:0 auto 16px;border:4px solid #e3e9e0;border-top-color:#496541;border-radius:50%;animation:r .8s linear infinite}
    h1{margin:0;font-size:24px;letter-spacing:-.03em}p{margin:9px 0 0;color:var(--m);font-size:13px;line-height:1.5}.e{display:none;margin-top:16px;padding:12px;border-radius:14px;background:#fff1ef;color:#8d2f24;font-size:12px}.e button{margin-top:10px;min-height:42px;padding:0 16px;border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:800}
    @keyframes r{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="c" role="status" aria-live="polite">
    <div class="s" id="spin"></div>
    <h1>SIGA 3ª CIA</h1>
    <p id="msg">Carregando ambiente administrativo…</p>
    <div class="e" id="erro">Não foi possível carregar o SIGA.<br><button type="button" onclick="location.reload()">TENTAR NOVAMENTE</button></div>
  </main>
  <script>
  (async function(){
    'use strict';
    const BASE='./runtime/index-base-r982.html';
    const PARTES=[1,2,3,4,5].map(n=>'./runtime/r984-0'+n+'.patch');
    function aplicar(baseText, patchText){
      const base=String(baseText||'').replace(/\r\n/g,'\n');
      const patch=String(patchText||'').replace(/\r\n/g,'\n');
      const inicio=patch.indexOf('--- a/index.html\n+++ b/index.html\n');
      if(inicio<0) throw new Error('Cabeçalho da atualização não localizado.');
      const fim=patch.indexOf('\n--- a/sw.js\n',inicio);
      const linhasPatch=(fim>=0?patch.slice(inicio,fim):patch.slice(inicio)).split('\n');
      const linhasBase=base.split('\n');
      const saida=[];
      let pos=0, i=2;
      while(i<linhasPatch.length){
        if(!linhasPatch[i].startsWith('@@ ')){i++;continue;}
        const h=linhasPatch[i].match(/^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/);
        if(!h) throw new Error('Trecho de atualização inválido.');
        const alvo=Number(h[1])-1;
        while(pos<alvo) saida.push(linhasBase[pos++]);
        i++;
        while(i<linhasPatch.length && !linhasPatch[i].startsWith('@@ ')){
          const linha=linhasPatch[i];
          if(!linha) break;
          const tipo=linha.charAt(0), corpo=linha.slice(1);
          if(tipo===' '){
            if(linhasBase[pos]!==corpo) throw new Error('Versão-base incompatível.');
            saida.push(corpo);pos++;
          }else if(tipo==='-'){
            if(linhasBase[pos]!==corpo) throw new Error('Versão-base incompatível.');
            pos++;
          }else if(tipo==='+'){
            saida.push(corpo);
          }else if(linha!=='\\ No newline at end of file'){
            break;
          }
          i++;
        }
      }
      while(pos<linhasBase.length) saida.push(linhasBase[pos++]);
      return saida.join('\n');
    }
    try{
      const respostas=await Promise.all([BASE].concat(PARTES).map(url=>fetch(url,{cache:'no-store'})));
      respostas.forEach(r=>{if(!r.ok) throw new Error('Falha HTTP '+r.status);});
      const textos=await Promise.all(respostas.map(r=>r.text()));
      const finalHtml=aplicar(textos[0],textos.slice(1).join(''));
      if(!finalHtml.includes('R9.8.4') || !finalHtml.includes('alternadorExtratoBancoHoras')) throw new Error('Atualização incompleta.');
      document.open();document.write(finalHtml);document.close();
    }catch(e){
      console.error('[SIGA bootstrap]',e);
      document.getElementById('spin').style.display='none';
      document.getElementById('msg').textContent='Falha ao carregar a interface.';
      document.getElementById('erro').style.display='block';
    }
  })();
  </script>
</body>
</html>
