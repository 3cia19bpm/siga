name: Aplicar Design System R9.6

on:
  push:
    branches: [main]
    paths:
      - '.github/r96/apply-r96.patch'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar patch R9.6
        run: |
          git apply --check .github/r96/apply-r96.patch
          git apply .github/r96/apply-r96.patch
          rm -f .github/r96/apply-r96.patch
          rm -f .github/workflows/aplicar-r96.yml
          rmdir .github/r96 2>/dev/null || true
      - name: Publicar R9.6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refina layout responsivo global do SIGA R9.6"
          git push
