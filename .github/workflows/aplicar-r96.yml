name: Aplicar Design System R9.6

on:
  push:
    branches: [main]
    paths:
      - '.github/r96/part06.b64'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validar e aplicar R9.6
        run: |
          cat .github/r96/part*.b64 | base64 -d | gzip -dc > /tmp/apply-r96.patch
          echo "60b008f782e12f3502dbff63fe303e5b43aa00d77e18bf9e53853e446de7ef72  /tmp/apply-r96.patch" | sha256sum -c -
          git apply --check /tmp/apply-r96.patch
          git apply /tmp/apply-r96.patch
          rm -f .github/r96/part*.b64
          rm -f .github/r96/apply-r96.patch.gz
          rm -f .github/r96/apply-r96.patch
          rm -f .github/workflows/aplicar-r96.yml
          rmdir .github/r96 2>/dev/null || true
      - name: Publicar R9.6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refina layout responsivo global do SIGA R9.6"
          git push
