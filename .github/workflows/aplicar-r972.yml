name: Aplicar SIGA R9.7.2

on:
  push:
    branches: [main]
    paths:
      - '.github/r972_apply.py'
      - '.github/workflows/aplicar-r972.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar revisão validada
        shell: bash
        run: |
          set -euo pipefail
          python .github/r972_apply.py

      - name: Validar resultado
        shell: bash
        run: |
          set -euo pipefail
          grep -q "R9.7.2" index.html
          grep -q "navegacaoPoliciaisP1" index.html
          grep -q "resumoModuloPoliciaisP1" index.html
          grep -q "siga-github-v5.9.0-r9.7.2" sw.js
          cp sw.js /tmp/sw-r972.js
          node --check /tmp/sw-r972.js
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          ids = re.findall(r'\bid=["\']([^"\']+)["\']', text)
          duplicados = sorted({x for x in ids if ids.count(x) > 1})
          if duplicados:
              raise SystemExit('IDs duplicados: ' + ', '.join(duplicados[:20]))
          PY

      - name: Publicar e limpar temporários
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/r972.patch .github/r972_apply.py .github/workflows/aplicar-r972.yml
          git config user.name "SIGA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Refina Central de Trabalho P1 R9.7.2"
          git push origin HEAD:main
