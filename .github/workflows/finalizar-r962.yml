name: Finalizar identificação R9.6.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Atualizar identificação da revisão
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if s.count('R9.6.1') != 3 or s.count('r9.6.1') != 1:
              raise SystemExit('Marcadores da revisão anterior não correspondem ao esperado.')
          s=s.replace('R9.6.1','R9.6.2').replace('r9.6.1','r9.6.2')
          p.write_text(s,encoding='utf-8')
          PY
          test "$(git hash-object index.html)" = "ae172560134fd1190dd911fe42c2bc8c1b1203f5"
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/check.js').write_text('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)),encoding='utf-8')
          PY
          node --check /tmp/check.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Finaliza identificação visual da R9.6.2'
          git push origin main
