name: Aplicar refinamento R9.6.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch validado
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/r962.patch
          patch -p1 --forward --batch < /tmp/r962.patch
          test "$(git hash-object index.html)" = "1b65fcd6e47f80169128730634122566108721d8"
          test "$(git hash-object sw.js)" = "9f2255a36b7a1613c01a51abdcd057ee1711e5e3"
          git diff --check

      - name: Validar JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          Path('/tmp/siga-index-check.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY2
          node --check /tmp/siga-index-check.js
          node --check sw.js

      - name: Confirmar invariantes da R9.6.2
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'painel painel-filtros-permutas-admin filtros-recolhidos' index.html
          grep -Fq 'aria-expanded="false"' index.html
          grep -Fq 'alternarFiltrosPermutasAdmin(false);' index.html
          grep -Fq 'maxlength="8"' index.html
          grep -Fq 'dataIsoParaBrCurtaPermutaR962' index.html
          grep -Fq "siga-github-v5.9.0-r9.6.2" sw.js

      - name: Publicar R9.6.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Corrige filtros e data de Permutas R9.6.2'
          git push origin main
